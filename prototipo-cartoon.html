<!doctype html>
<html><head><meta charset="utf-8"><title>Protótipo Cartoon</title>
<style>
html,body{margin:0;height:100%;background:#fbefe0;overflow:hidden;font-family:system-ui,sans-serif}
svg{width:100vw;height:100vh;display:block}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px)}}
.breath{transform-box:fill-box;transform-origin:50% 100%;animation:breath 2.6s ease-in-out infinite}
@keyframes breath{50%{transform:scaleY(1.015)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.brow{transform-box:fill-box;transform-origin:center;animation:brow 3s ease-in-out infinite}
@keyframes brow{0%,60%,100%{transform:translateY(0)}70%,85%{transform:translateY(-6px)}}
.talk{transform-box:fill-box;transform-origin:50% 20%;animation:talk .26s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1.1)}}
.gesture{transform-box:fill-box;transform-origin:50% 6%;animation:gest 3.2s ease-in-out infinite}
@keyframes gest{0%,100%{transform:rotate(-68deg)}50%{transform:rotate(-92deg)}}
.headtilt{transform-box:fill-box;transform-origin:50% 90%;animation:tilt 5s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
.beat{transform-box:fill-box;transform-origin:center;animation:beat .9s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.1,1.08)}28%{transform:scale(.97)}42%{transform:scale(1.05)}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring .9s ease-out infinite;fill:none;stroke:#e63946;stroke-width:5}
@keyframes ring{from{transform:scale(.7);opacity:.6}to{transform:scale(1.5);opacity:0}}
.wave{transform-box:fill-box;transform-origin:95% 90%;animation:wave .55s ease-in-out infinite alternate}
@keyframes wave{to{transform:rotate(22deg)}}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.float{animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-14px)}}
</style></head><body>
<svg viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet">
<defs>
 <!-- contorno "nanquim": mais grosso embaixo/direita, como traço desenhado à mão -->
 <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
  <feMorphology in="SourceAlpha" operator="dilate" radius="2.6" result="a"/>
  <feMorphology in="SourceAlpha" operator="dilate" radius="3.4" result="b0"/><feOffset in="b0" dx="2.2" dy="3" result="b"/>
  <feMerge result="m"><feMergeNode in="a"/><feMergeNode in="b"/></feMerge>
  <feFlood flood-color="#2a2238"/><feComposite in2="m" operator="in" result="line"/>
  <feMerge><feMergeNode in="line"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
 <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
 <radialGradient id="skin" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#ffe0c4"/><stop offset=".6" stop-color="#f7c49d"/><stop offset="1" stop-color="#e9a77f"/></radialGradient>

<script>
const lines=["Wusstest du das?","Dein Herz schlägt etwa 100.000 Mal am Tag.","Das sind rund 35 Millionen Schläge im Jahr!","Bewegung hält es stark – schon 30 Minuten täglich."];
const sub=document.getElementById('sub'),num=document.getElementById('num');let i=0;
function next(){sub.textContent=lines[i%lines.length];sub.classList.remove('pop');void sub.getBBox();sub.classList.add('pop');i++}
next();setInterval(next,3000);
const t0=performance.now();(function c(n){const p=((n-t0)%12000)/4000;const v=Math.round(Math.min(p,1)*100000);
 num.textContent=v.toLocaleString('de-DE')+(p>=1?' ❤':'');requestAnimationFrame(c)})(t0);
</script></body></html>
