<!doctype html>
<html><head><meta charset="utf-8"><title>Takes em CSS</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif}
.take{position:absolute;inset:0;display:none}
.take.on{display:block}
.t1{background:#58b8}.t2{background:#cfe9e2}.t3{background:#f6dcc8}
.label{position:absolute;top:2vmin;left:2vmin;font:700 2vmin system-ui;color:#0008}
.caption{position:absolute;left:50%;bottom:4vmin;transform:translateX(-50%);background:#222c;color:#fff;font:800 3.2vmin system-ui;padding:1.4vmin 3vmin;border-radius:1.5vmin;white-space:nowrap;z-index:5}

/* ===== base da referência (Alvaro Montoro) ===== */
.cartoon{position:absolute;bottom:0;left:50%;transform:translate(-50%,0);width:80vmin;height:80vmin;
 --skin:#fca;--skin-dark:#fb9;--cap-light:#369;--cap-dark:#258;--cap-lid:#666}
.cartoon div{position:absolute;box-sizing:border-box}
.hb::before,.ha::after{content:"";display:block;position:absolute;box-sizing:border-box}
.eyes{width:60%;height:60%;top:50%;left:50%;transform:translate(-50%,-50%);
 background-image:linear-gradient(transparent 30%,var(--skin) 0 40%,black 0 41.5%,transparent 0),
  radial-gradient(circle at 45% 50%,black 5%,transparent 0),radial-gradient(circle at 75% 50%,black 4%,transparent 0),
  radial-gradient(circle at 35% 50%,white 20%,black 0 21.5%,transparent 0),radial-gradient(circle at 65% 50%,white 20%,black 0 21.5%,transparent 0);
 background-position:center center;background-size:61% 100%,100% 100%,100% 100%,100% 100%,100% 100%;background-repeat:no-repeat}
.face{width:50%;height:60%;background:var(--skin);background-image:radial-gradient(circle at 55% 100%,rgba(0,0,0,.1) 44%,transparent 0);
 border:.75vmin solid;border-bottom:1vmin solid;border-top-color:var(--skin);border-left:.1vmin solid var(--skin);
 border-radius:100%/120% 120% 80% 80%;transform:translate(-50%,0) rotate(-15deg);left:45%;top:33%}
.nose{width:15%;height:10%;background:var(--skin);background-image:linear-gradient(to right,transparent,var(--skin-dark));
 border:.66vmin solid;border-right:.75vmin solid;border-left:.5vmin solid var(--skin);border-radius:120% 80% 90% 100%/100%;top:53%;left:48%;transform:rotate(-15deg)}
.ear{width:20%;height:30%;border-radius:100%/80% 80% 120% 125%;border:.75vmin solid;border-right:1.125vmin solid var(--skin);border-left:1.1vmin solid;
 background:var(--skin);top:50%;left:5%;transform:rotate(-12deg)}
.ear::before{width:70%;height:60%;border:1.25vmin solid transparent;border-top:.75vmin solid;border-right:.5vmin solid;border-radius:50%;top:22%;right:15%;
 box-shadow:inset -1.5vmin 2vmin 0 -.5vmin var(--skin-dark)}
.ear::after{width:30%;height:20%;border:.75vmin solid;border-bottom:.25vmin solid transparent;border-right:.75vmin solid transparent;border-radius:50%;
 right:17%;top:55%;transform:rotate(30deg);box-shadow:-2vmin -1vmin 0 .5vmin var(--skin-dark)}
.ear.ear-back{border-left:.75vmin solid;transform:scaleX(-1) rotate(-10deg);left:52%;top:46%;background-image:linear-gradient(to right,transparent,var(--skin-dark) 20%)}
.neck{width:30%;height:25%;background:var(--skin);border-left:1vmin solid;border-right:.75vmin solid;top:75%;left:20%;
 background-image:radial-gradient(circle at 83% 25%,var(--skin-dark) 55%,transparent 0)}
.forehead{width:57%;height:60%;background:var(--skin);border:.75vmin solid;border-radius:50%;left:12.5%;top:13.5%}
.mouth{width:30%;height:20%;border:1.25vmin solid transparent;border-bottom:.5vmin solid;border-right:.5vmin solid transparent;border-radius:50%;top:56%;left:37%;transform:rotate(10deg)}
.mouth::after{width:20%;height:30%;border:.25vmin solid transparent;border-left:.75vmin solid;border-radius:50%;top:80%;left:15%;transform:rotate(15deg)}
.show-cap .cap{width:85%;height:20%;border:.75vmin solid;border-radius:80% 125% 125% 80%/100%;transform:rotate(-25deg);top:31.5%;left:5%;
 border-left:1.5vmin solid transparent;border-right:1.25vmin solid transparent;border-bottom:.125vmin solid transparent}
.show-cap .cap-lid{background:black;background-image:linear-gradient(45deg,transparent 0%,var(--cap-lid));border-right:1.25vmin solid;border-bottom:.5vmin solid}
.show-cap .cap-top{width:60%;height:35%;border:.75vmin solid;border-radius:120% 100% 0 0;border-bottom:0 solid transparent;transform:rotate(-26deg);top:5%;left:.5%;
 background-image:linear-gradient(var(--cap-light),var(--cap-dark) 92%,transparent 0),linear-gradient(6deg,transparent 16%,var(--cap-dark) 0),linear-gradient(-10deg,transparent 22%,var(--cap-dark) 0)}
.eyebrow{width:25%;height:25%;border-radius:100%/50%;box-shadow:1vmin -4vmin 0 -1.75vmin;transform:rotate(-15deg);top:38.5%;left:27%}
.eyebrow+.eyebrow{transform:scaleX(-1) rotate(-12deg);left:48.5%;top:38%;width:23%}

/* ===== Dr. Max: mesmo estilo, novas peças ===== */
.doc{bottom:24vmin;width:62vmin;height:62vmin;--hair:#6b3f22;--hair-dark:#4a2a15}
.doc .glasses,.doc .fringe,.doc .lapel{display:none}
/* cabelo: bloco orgânico (border-radius assimétrico) + fios curvos */
.doc .hair2{top:5%;left:8%;width:66%;height:32%;background:linear-gradient(170deg,#8a5632,#5a341c 70%);
 border:.75vmin solid;border-right-width:1.1vmin;border-bottom-width:1vmin;
 border-radius:38% 58% 30% 62%/62% 66% 22% 48%;transform:rotate(-14deg)}
.doc .hair3{top:16%;left:9.5%;width:24%;height:36%;background:#5a341c;border:.75vmin solid;border-right:0;border-top:0;
 border-radius:30% 0 30% 70%/20% 0 40% 80%;transform:rotate(8deg)}
.doc .strand{border-left:.55vmin solid #2a170b;border-radius:50%;opacity:.9}
.doc .s1{top:13%;left:20%;width:5%;height:12%;transform:rotate(-50deg)}
.doc .s2{top:8.5%;left:30%;width:5%;height:12%;transform:rotate(-24deg)}
.doc .s3{top:7%;left:42%;width:5%;height:11%;transform:rotate(6deg)}
.doc .s4{top:8%;left:54%;width:5%;height:12%;transform:rotate(30deg)}
.doc .s5{top:19%;left:60%;width:9%;height:11%;border-left:0;border-top:.55vmin solid #2a170b;border-radius:60% 0 0 0;transform:rotate(-8deg)}
.doc .hair{width:60%;height:26%;top:2%;left:4%;border:.75vmin solid;border-bottom:0 solid transparent;border-right:1.1vmin solid;
 border-radius:110% 120% 30% 20%/130% 120% 0 0;transform:rotate(-22deg);
 background-image:linear-gradient(var(--hair),var(--hair-dark) 90%,transparent 0),linear-gradient(8deg,transparent 18%,var(--hair-dark) 0)}
.doc .hair::before{width:55%;height:40%;top:12%;left:20%;border-top:.6vmin solid #8a5a36;border-radius:50%;transform:rotate(-6deg)}
.doc .fringe{width:30%;height:12%;top:24%;left:34%;background:var(--hair-dark);border:.75vmin solid;border-top:0;border-left:0;
 border-radius:0 0 100% 30%/0 0 100% 60%;transform:rotate(-18deg)}
.doc .sideburn{width:6%;height:12%;top:36%;left:21%;background:var(--hair-dark);border-left:.9vmin solid;border-bottom:.5vmin solid;border-radius:0 0 40% 80%;transform:rotate(-12deg)}
.doc .glasses{width:60%;height:60%;top:50%;left:50%;transform:translate(-50%,-50%);
 background-image:radial-gradient(circle at 35% 50%,rgba(255,255,255,.25) 23%,black 0 25.5%,transparent 0),
  radial-gradient(circle at 65% 50%,rgba(255,255,255,.25) 23%,black 0 25.5%,transparent 0),
  linear-gradient(black,black);background-size:100% 100%,100% 100%,7% .6vmin;background-position:0 0,0 0,47% 47%;background-repeat:no-repeat}
.doc .glasses::after{width:30%;height:.6vmin;background:black;top:44%;left:-14%;transform:rotate(10deg)}
.doc .coat{width:120%;height:45%;top:95%;left:-27%;background:#fff;border:.75vmin solid;border-bottom:0;border-right:1.1vmin solid;
 border-radius:50% 60% 0 0/60% 60% 0 0;background-image:linear-gradient(to right,transparent 70%,#e4ebf3 0)}
.doc .shirt{width:24%;height:24%;top:95%;left:23%;background:#7cbcf0;clip-path:polygon(0 0,100% 0,50% 100%)}
.doc .lapel{width:14%;height:28%;top:95%;border-right:.75vmin solid;background:transparent}
.doc .lapel.l{left:17%;transform:skewX(22deg);transform-origin:top}
.doc .lapel.r{left:38%;border-right:0;border-left:.75vmin solid;transform:skewX(-22deg);transform-origin:top}
.doc .steth{width:56%;height:26%;top:97%;left:7%;border:.8vmin solid #333;border-top-color:transparent;border-radius:0 0 50% 50%/0 0 100% 100%}
.doc .steth::before{width:4.5vmin;height:4.5vmin;border-radius:50%;background:#ccd;border:.6vmin solid;right:2vmin;bottom:-3vmin}
.doc .badge{width:22%;height:7%;top:104%;left:68%;background:#2a9d8f;border:.5vmin solid;border-radius:.8vmin;color:#fff;font:900 2.2vmin system-ui;display:grid;place-items:center;transform:rotate(-4deg)}
.doc .cheek{width:11%;height:7%;top:61%;left:56%;border-radius:50%;background:radial-gradient(#f88a,transparent 70%)}
/* expressões */
.surprised .mouth{width:9%;height:10%;top:67%;left:44%;border:.6vmin solid;border-radius:50%;background:#7a2a2a;transform:none}
.surprised .mouth::after{display:none}
.surprised .eyebrow{top:33%}.surprised .eyebrow+.eyebrow{top:32%}
</style></head><body>

<section class="take t1 on">
 <div class="label">Take 1 · referência original (3 s)</div>
 <div class="cartoon hb show-cap">
  <div class="cap cap-lid"></div><div class="ear ear-back"></div><div class="neck"></div><div class="forehead"></div><div class="face"></div>
  <div class="eyes"></div><div class="nose"></div><div class="mouth ha"></div><div class="eyebrow"></div><div class="eyebrow"></div>
  <div class="cap-top"></div><div class="ear ha hb"></div><div class="cap"></div>
 </div>
</section>

<section class="take t2">
 <div class="label">Take 2 · Dr. Max sorrindo (3 s)</div>
 <div class="cartoon hb doc">
  <div class="ear ear-back"></div><div class="neck"></div>
  <div class="coat"></div><div class="shirt"></div><div class="lapel l"></div><div class="lapel r"></div><div class="steth hb"></div><div class="badge">Dr. Max</div>
  <div class="forehead"></div><div class="face"></div>
  <div class="cheek"></div><div class="eyes"></div><div class="glasses ha"></div><div class="nose"></div><div class="mouth ha"></div>
  <div class="eyebrow"></div><div class="eyebrow"></div>
  <div class="hair3"></div><div class="hair2"></div><div class="strand s1"></div><div class="strand s2"></div><div class="strand s3"></div><div class="strand s4"></div><div class="strand s5"></div><div class="sideburn"></div><div class="ear ha hb"></div>
 </div>
 <div class="caption">Hallo! Ich bin Dr. Max.</div>
</section>

<section class="take t3">
 <div class="label">Take 3 · Dr. Max surpreso (3 s)</div>
 <div class="cartoon hb doc surprised">
  <div class="ear ear-back"></div><div class="neck"></div>
  <div class="coat"></div><div class="shirt"></div><div class="lapel l"></div><div class="lapel r"></div><div class="steth hb"></div><div class="badge">Dr. Max</div>
  <div class="forehead"></div><div class="face"></div>
  <div class="cheek"></div><div class="eyes"></div><div class="glasses ha"></div><div class="nose"></div><div class="mouth ha"></div>
  <div class="eyebrow"></div><div class="eyebrow"></div>
  <div class="hair3"></div><div class="hair2"></div><div class="strand s1"></div><div class="strand s2"></div><div class="strand s3"></div><div class="strand s4"></div><div class="strand s5"></div><div class="sideburn"></div><div class="ear ha hb"></div>
 </div>
 <div class="caption">100.000 Herzschläge – jeden Tag!</div>
</section>

<script>
const takes=[...document.querySelectorAll('.take')];let i=0;
const show=n=>takes.forEach((t,k)=>t.classList.toggle('on',k===n));
const q=new URLSearchParams(location.search).get('take');
if(q)show(+q-1);else setInterval(()=>{i=(i+1)%takes.length;show(i)},3000);
</script>
</body></html>
